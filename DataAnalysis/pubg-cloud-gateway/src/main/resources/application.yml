server:
  port: 8084
  encoding:
    charset: UTF-8
    force: true
spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://pubg-user-service
          predicates:
            - Path=/pubg/user/**
        - id: season-service
          uri: lb://pubg-season-data
          predicates:
            - Path=/pubg/season/**
        - id: weapon-service
          uri: lb://pubg-weapon-data
          predicates:
            - Path=/pubg/weapon/**
  application:
    name: pubg-cloud-gateway
  messages:
    encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6379
      pool:
        max-active: 8
        # ???????????????????????
        max-wait: -1
        # ???????????
        max-idle: 8
        # ???????????
        min-idle: 0
        # ??????????
        timeout: 30000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/

auth:
  jwt:
    enabled: true   # ????JWT??????
    secret: passjava  # JWT ???????JWT??????
    expiration: 3600000 # JWT ???????????JWT???????????
    header: Authorization # HTTP ??? Header ???? Header?????? JWT ??
    userParamName: userId  # ?????????????
    pwdParamName: password  # ????????????
    useDefaultController: true # ???????JwtAuthController
    skipValidUrl: /auth/login
