server:
  port: 8083
  encoding:
    charset: UTF-8
    force: true
  servlet:
    context-path: ""
spring:
  data:
    redis:
      host: localhost
      port: 6379
      pool:
        max-active: 8
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接超时时间（毫秒）
        timeout: 30000
  application:
    name: pubg-user-data
  messages:
    encoding: UTF-8
  datasource:
    url: jdbc:mysql://localhost:3306/my_pubg?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    user:
      name: admin
      password: admin
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
  global-config:
    db-config:
      id-type: auto
      field-strategy: not_empty
      db-type: mysql
jwt:
  secret: rlFgiCr2rRMch/bTWYbz=p8IY/Rj8oQdcu2zpj1/SQzrE= # 密钥，一定要>=256bit，不是256长度，>=32位长度就行，不然报错
  expiration: 259200000 # 3天过期时间
