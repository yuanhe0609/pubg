server:
  port: 8083
  encoding:
    charset: UTF-8
    force: true
spring:
  application:
    name: pubg-user-data
  messages:
    encoding: UTF-8
  datasource:
    url: jdbc:mysql://localhost:3306/my_pubg?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    user:
      name: admin
      password: admin
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
  global-config:
    db-config:
      id-type: auto
      field-strategy: not_empty
      db-type: mysql

